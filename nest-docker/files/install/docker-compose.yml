# `db` publishes 5432 to the host with a default/placeholder credential
# (user/password) so it works out of the box for local dev. That is not
# safe on any host reachable from outside your machine -- set real
# POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB via .env and drop the host
# port mapping, or bind it to 127.0.0.1 (e.g. "127.0.0.1:5432:5432"),
# before running this anywhere but localhost.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dbname}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dbname}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-dbname}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
